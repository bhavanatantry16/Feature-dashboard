name: Deploy app

# One environment, one instance: master is what runs in Azure.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login to Azure — no publish profile to rotate
  contents: read

# Never let two deploys overlap onto the single instance.
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  # Without this gate, merging to master in a repo that has not wired up OIDC
  # fails at "Sign in to Azure" on every push. The secrets context is not
  # readable from a job-level `if`, so read them as env here and publish a
  # plain output the deploy job can gate on.
  preflight:
    name: Check Azure configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] && [ -n "$WEBAPP_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "Azure is not wired up for this repository yet. Set repository secrets"
              echo "\`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\`, \`AZURE_SUBSCRIPTION_ID\` and variables"
              echo "\`AZURE_WEBAPP_NAME\`, \`AZURE_RESOURCE_GROUP\` to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Dependencies are installed here rather than by Oryx on the app side, so
      # what CI tested is byte-for-byte what runs. Matches
      # SCM_DO_BUILD_DURING_DEPLOYMENT=false in the Bicep.
      - name: Install production dependencies
        run: npm ci --omit=dev

      # There is no build step — the frontend is static HTML with Tailwind and
      # Chart.js from CDN, served by Express itself.
      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'infra/*' \
            -x '.env' \
            -x 'release.zip'

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip

      # /healthz is the only route that stays anonymous — everything else
      # redirects to the login page, which would make a 302 look like success.
      - name: Smoke test
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            echo "attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "App is serving."
              exit 0
            fi
            sleep 10
          done
          echo "App did not return 200 after startup. Check the log stream:"
          echo "  az webapp log tail --name ${{ vars.AZURE_WEBAPP_NAME }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}"
          exit 1
