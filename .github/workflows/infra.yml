name: Infrastructure

# Bicep is deployed separately from the app: infrastructure changes are rare,
# and a what-if on the pull request is the review artefact.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [master]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # to post the what-if output as a comment

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  # Azure credentials are optional repository configuration, so without this
  # gate every pull request to a repo that has not wired up OIDC yet fails at
  # "Sign in to Azure" — a red X that says nothing except "not set up". The
  # secrets context is not readable from a job-level `if`, hence a preflight
  # job that reads them as env and publishes a plain output.
  preflight:
    name: Check Azure configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] && [ -n "$RESOURCE_GROUP" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Azure configuration present." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Infrastructure job skipped"
              echo
              echo "Azure is not wired up for this repository yet, so there is nothing to deploy against."
              echo
              echo "To enable it, set repository secrets \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\`,"
              echo "\`AZURE_SUBSCRIPTION_ID\` and variables \`AZURE_RESOURCE_GROUP\`, \`AZURE_WEBAPP_NAME\`,"
              echo "then add federated credentials to the Entra app registration."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  infra:
    name: ${{ github.event_name == 'pull_request' && 'What-if' || 'Deploy' }}
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'

    env:
      # Keep the provisioned app name identical to the one deploy.yml ships to.
      DASH_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

      # Mapped onto the readEnvironmentVariable() calls in main.bicepparam.
      # Unset secrets arrive as empty strings, which the template reads as
      # "leave the existing vault value alone".
      #
      # The DASH_ prefix is deliberate: GitHub reserves GITHUB_* for its own
      # environment variables and setting one here is an error.
      DASH_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_PAT }}
      DASH_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASH_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
      DASH_OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_OAUTH_CLIENT_SECRET }}
      DASH_AZDO_PAT: ${{ secrets.DASHBOARD_AZDO_PAT }}
      DASH_APPS_SCRIPT_SECRET: ${{ secrets.DASHBOARD_APPS_SCRIPT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

      - name: What-if
        if: github.event_name == 'pull_request'
        run: |
          az deployment group what-if \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --result-format FullResourcePayloads

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          az deployment group create \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name 'feature-dashboard-${{ github.run_number }}' \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --output json > deployment.json

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Infrastructure deployed'
            echo
            echo "| Output | Value |"
            echo "| --- | --- |"
            jq -r '.properties.outputs
                   | to_entries[]
                   | "| \(.key) | \(.value.value) |"' deployment.json
          } >> "$GITHUB_STEP_SUMMARY"
